<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정적 크롤링 연습 페이지</title>
</head>
<body>
  <header>
    <h1 id="page-title">오늘의 추천 도서</h1>
    <p class="description">정적 크롤링 연습을 위한 테스트 페이지입니다.</p>
  </header>

  <main>
    <section id="book-list">
      <h2>도서 목록</h2>

      <article class="book">
        <h3 class="book-title">파이썬으로 시작하는 코딩</h3>
        <p class="author">저자: 김파이썬</p>
        <p class="price">가격: 18,000원</p>
        <a href="https://example.com/books/python-start">자세히 보기</a>
      </article>

      <article class="book">
        <h3 class="book-title">문제 해결의 첫걸음</h3>
        <p class="author">저자: 이알고리즘</p>
        <p class="price">가격: 15,500원</p>
        <a href="https://example.com/books/problem-solving">자세히 보기</a>
      </article>

      <article class="book sold-out">
        <h3 class="book-title">웹 데이터 수집 입문</h3>
        <p class="author">저자: 박크롤링</p>
        <p class="price">가격: 22,000원</p>
        <span class="status">품절</span>
        <a href="https://example.com/books/web-crawling">자세히 보기</a>
      </article>
    </section>

    <section id="ranking">
      <h2>인기 순위</h2>
      <table>
        <thead>
          <tr>
            <th>순위</th>
            <th>제목</th>
            <th>평점</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>파이썬으로 시작하는 코딩</td>
            <td>4.9</td>
          </tr>
          <tr>
            <td>2</td>
            <td>문제 해결의 첫걸음</td>
            <td>4.7</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>연습용 페이지이므로 실제 상품 정보가 아닙니다.</p>
  </footer>
</body>
</html>
